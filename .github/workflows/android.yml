name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Debug Mode)
      run: ./gradlew assembleDebug --stacktrace --info --debug
      # Note: --debug produces massive logs, --info is usually enough, but we're going all out for you.

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always() # Ensure we attempt upload or log capture even if build fails
      with:
        name: calai-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
